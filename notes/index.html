<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/noto-sans-sc/latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/playfair-display-italic/latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#f5faff" />
    <meta
      name="description"
      content="Alicia's personal wiki for formulas, source code, CUDA APIs, and SPICE algorithms."
    />
    <meta property="og:title" content="Notes / Knowledge Base · Alicia" />
    <meta
      property="og:description"
      content="Alicia's personal wiki for formulas, source code, CUDA APIs, and SPICE algorithms."
    />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <title>Notes / Knowledge Base · Alicia</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('alicia-sky-theme') === 'night' ? 'night' : 'day';
      } catch {
        document.documentElement.dataset.theme = 'day';
      }
      // The reader's own text size, line spacing and font, as Text in a document sets them.
      try {
        const reading = JSON.parse(localStorage.getItem('alicia-reading-text')) ?? {};
        for (const key of ['size', 'spacing', 'font'])
          if (typeof reading[key] === 'string')
            document.documentElement.setAttribute('data-reading-' + key, reading[key]);
      } catch {
        /* Without storage, documents keep the usual text. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Please enable JavaScript to read the knowledge base.<a href="../">Back to home</a></noscript
    >
    <script type="module" src="/src/notes/main.tsx"></script>
  </body>
</html>
