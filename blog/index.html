<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/noto-sans-sc/latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/playfair-display-italic/latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#f5faff" />
    <meta
      name="description"
      content="Alicia’s blog. Code, learning, and little discoveries worth sharing."
    />
    <meta property="og:title" content="Blog · Alicia" />
    <meta
      property="og:description"
      content="Alicia’s blog. Code, learning, and little discoveries worth sharing."
    />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <title>Blog · Alicia</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('alicia-sky-theme') === 'night' ? 'night' : 'day';
      } catch {
        document.documentElement.dataset.theme = 'day';
      }
      // The reader's own text size, line spacing and font, as Text in a document sets them.
      try {
        const reading = JSON.parse(localStorage.getItem('alicia-reading-text')) ?? {};
        for (const key of ['size', 'spacing', 'font'])
          if (typeof reading[key] === 'string')
            document.documentElement.setAttribute('data-reading-' + key, reading[key]);
      } catch {
        /* Without storage, documents keep the usual text. */
      }
    </script>
    <!-- Chromium browsers load a page in the background once a link to it is hovered or
         pressed, so it opens at once; others ignore this. In-page anchors are left out. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "or": [{ "href_matches": "/" }, { "href_matches": "/*/" }] },
                { "not": { "selector_matches": "[href^='#'], [target], [download]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to read the blog.<a href="../">Back to home</a></noscript>
    <script type="module" src="/src/blog/main.tsx"></script>
  </body>
</html>
