<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5faff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline · Alicia</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('alicia-sky-theme') === 'night' ? 'night' : 'day';
      } catch {
        document.documentElement.dataset.theme = 'day';
      }
    </script>
    <!-- Shown by the service worker for a page it has not kept, while there is no connection. -->
    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/playfair-display-italic/latin.woff2') format('woff2');
      }
      :root {
        --page: #f5faff;
        --surface: #fff;
        --ink: #34475f;
        --heading: #203b58;
        --muted: #61778d;
        --blue: #3688d8;
        --blue-strong: #2977c6;
        --light-blue: #edf6fe;
        --line: #e7eef5;
        --font-body:
          'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-display: 'Playfair Display', 'STXingkai', 'Xingkai SC', '华文行楷', serif;
        color-scheme: light;
      }
      :root[data-theme='night'] {
        --page: #111e33;
        --surface: #192b43;
        --ink: #b8cee2;
        --heading: #dceafa;
        --muted: #93abc2;
        --blue: #8ebff0;
        --blue-strong: #95cafa;
        --light-blue: #1d3652;
        --line: #2a3d55;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 40px 20px;
        background: var(--page);
        color: var(--ink);
        font-family: var(--font-body);
        line-height: 1.7;
      }
      main {
        width: min(560px, 100%);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 17px;
        background: #3a8de0;
      }
      h1 {
        margin: 22px 0 6px;
        color: var(--heading);
        font-family: var(--font-display);
        font-size: 34px;
        font-style: italic;
        font-weight: 400;
        line-height: 1.4;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      button {
        margin-top: 18px;
        min-height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #2977c6;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #2268af;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 4px;
      }
      section {
        margin-top: 34px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }
      section[hidden] {
        display: none;
      }
      h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li a {
        display: block;
        margin-inline: -12px;
        padding: 9px 12px;
        border-radius: 8px;
        color: var(--heading);
        text-decoration: none;
      }
      li a:hover {
        background: var(--light-blue);
        color: var(--blue-strong);
      }
      li strong {
        display: block;
        font-family: var(--font-display);
        font-size: 17px;
        font-style: italic;
        font-weight: 400;
      }
      li span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="40" height="40">
          <path d="M19 43a10 10 0 0 1-1-20 14 14 0 0 1 26-1 11 11 0 1 1 2 21Z" fill="white" />
          <path d="m30 27 4 7-8 4 3-6-7-3Z" fill="#9ed4fa" />
        </svg>
      </div>
      <h1>You’re offline</h1>
      <p>This page isn’t saved on this device yet. It will open once you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <section id="kept" hidden aria-labelledby="kept-title">
        <h2 id="kept-title">Saved for reading offline</h2>
        <ul></ul>
      </section>
    </main>
    <script>
      // Every page read before stays here; the latest come first.
      (async () => {
        if (!('caches' in window)) return;
        const cache = await caches.open('alicia-pages-v1');
        const pages = [];
        for (const request of (await cache.keys()).reverse()) {
          const html = await (await cache.match(request)).text();
          const kept = new DOMParser().parseFromString(html, 'text/html');
          const title = kept.title.trim();
          const about = kept.querySelector('meta[name="description"]')?.content.trim();
          if (title) pages.push({ href: new URL(request.url).pathname, title, about });
        }
        if (!pages.length) return;
        const list = document.querySelector('#kept ul');
        for (const { href, title, about } of pages) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = href;
          const name = document.createElement('strong');
          name.textContent = title.replace(/ · Alicia( Blog)?$/, '');
          link.append(name);
          if (about) {
            const line = document.createElement('span');
            line.textContent = about;
            link.append(line);
          }
          item.append(link);
          list.append(item);
        }
        document.querySelector('#kept').hidden = false;
      })().catch(() => {});
      // Back online, the page opens once the site answers. Leaving for a saved page can also
      // report a connection; the check ends with this page, so it never pulls the reader back.
      window.addEventListener('online', () => {
        fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(
          () => location.reload(),
          () => {},
        );
      });
    </script>
  </body>
</html>
