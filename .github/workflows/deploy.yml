name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The site's code lives in web/; its documents stay in content/ at the repository's root.
    defaults:
      run:
        working-directory: web
    env:
      # Locked documents live in a private repository, read with a deploy key. Builds without
      # the key, such as pull requests from forks, publish the public documents alone.
      HAS_LOCKED_ARTICLES: ${{ secrets.LOCKED_ARTICLES_KEY != '' }}
      # The server takes each build of main through a deploy key that can only hand it over.
      HAS_VPS_KEY: ${{ secrets.VPS_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out locked documents
        if: env.HAS_LOCKED_ARTICLES == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Alicia24012867/locked-articles
          ssh-key: ${{ secrets.LOCKED_ARTICLES_KEY }}
          path: content/locked
          # Dates come from each document's history, as they do for public documents.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run format:check && npm run check
        env:
          # Seals locked documents, each level with its own password: LOCKED_PASSWORD for the
          # lowest, then LOCKED_PASSWORD_2 and up. A build with documents of a level and no
          # password for it fails.
          LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
          LOCKED_PASSWORD_2: ${{ secrets.LOCKED_PASSWORD_2 }}
          LOCKED_PASSWORD_3: ${{ secrets.LOCKED_PASSWORD_3 }}
          LOCKED_PASSWORD_4: ${{ secrets.LOCKED_PASSWORD_4 }}
          LOCKED_PASSWORD_5: ${{ secrets.LOCKED_PASSWORD_5 }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist
      - name: Publish to the server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_VPS_KEY == 'true'
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: 107.170.11.167
          VPS_PORT: 2222
          # The server's own host key, so the build talks to no one else.
          VPS_KNOWN_HOST: '[107.170.11.167]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF0YpsbSXVJgHSbIJ95f2xnNdlxxBE6HMu4yjg9FapkX'
        # deploy/site/receive unpacks the tar beside the live site and switches to it. public/ is
        # the site; private/ holds the locked documents in plain form, for the blog API alone.
        # Neither is listed here: the log is public.
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          mkdir release
          mv dist release/public
          mv dist-private release/private
          tar -C release -cf - public private |
            ssh -i ~/.ssh/vps_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -p "$VPS_PORT" "alicia@$VPS_HOST" receive "$GITHUB_SHA"
          rm -f ~/.ssh/vps_deploy

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
